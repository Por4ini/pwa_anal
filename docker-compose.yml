name: pwa-analytics

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pwa_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-pwa_analytics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pwa_analytics_local}
    volumes:
      - analytics_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pwa_analytics} -d ${POSTGRES_DB:-pwa_analytics}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pwa_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-pwa_analytics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pwa_analytics_local}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-only-insecure-secret}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:-local-dashboard-token}
      ANALYTICS_IP_HASH_SALT: ${ANALYTICS_IP_HASH_SALT:-local-ip-hash-salt}
      ANALYTICS_REQUESTS_PER_MINUTE: ${ANALYTICS_REQUESTS_PER_MINUTE:-240}
      ANALYTICS_RETENTION_DAYS: ${ANALYTICS_RETENTION_DAYS:-730}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000,http://pwa.ordr.bz:8000}
      CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:-true}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

  gateway:
    build:
      context: ./gateway
    restart: unless-stopped
    ports:
      - "${ANALYTICS_GATEWAY_PORT:-67}:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/gateway-health"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  analytics_postgres_data:
